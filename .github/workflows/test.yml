name: Test pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/verify-offline-flop.py
      - run: git diff --exit-code -- data/offline-v1/verification.json
      - run: npm test
