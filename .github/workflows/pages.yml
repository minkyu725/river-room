name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Prepare static site
        run: |
          mkdir _site
          cp six-opponent-probabilities.js preflop-six-counts.js five-opponent-probabilities.js preflop-five-counts.js table-source.js compressed-table.js exact-probability.js four-opponent-probabilities.js preflop-four-counts.js multiway-probabilities.js three-opponent-probabilities.js preflop-three-counts.js two-opponent-probabilities.js preflop-two-counts.js index.html style.css mobile.css app.js flop-probabilities.js headsup-probabilities.js river-probabilities.js preflop-headsup-counts.js engine.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png _site/
          python3 scripts/copy-pages-data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
