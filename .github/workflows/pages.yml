name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/verify-offline-flop.py
      - run: git diff --exit-code -- data/offline-v1/verification.json
      - run: npm test
      - name: Prepare static site
        run: |
          mkdir _site
          cp app.js card-canonical.js engine.js exact-probability.js icon-192.png icon-512.png icon.svg index.html manifest.webmanifest mobile.css offline-flop.js offline-graph.js offline-manifest.js offline-probabilities.js offline-river.js offline-supports.js offline-worker.js preflop-five-counts.js preflop-four-counts.js preflop-headsup-counts.js preflop-six-counts.js preflop-three-counts.js preflop-two-counts.js style.css sw.js _site/
          python3 scripts/copy-pages-data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
